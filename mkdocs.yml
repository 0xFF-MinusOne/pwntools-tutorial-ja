site_name: Pwntools チュートリアル(日本語訳)
site_description: Gallopsled/pwntools-tutorial の日本語訳
site_url: https://0xff-minusone.github.io/pwntools-tutorial-ja/
repo_url: https://github.com/0xFF-MinusOne/pwntools-tutorial-ja
docs_dir: .site-src
copyright: >-
  日本語訳。原著:
  <a href="https://github.com/Gallopsled/pwntools-tutorial">Gallopsled/pwntools-tutorial</a>
  (<a href="http://pwntools.com">pwntools.com</a>)
  / ライセンス: <a href="https://github.com/0xFF-MinusOne/pwntools-tutorial-ja/blob/main/LICENSE">MIT</a>
  <br>Unofficial Japanese translation of <a href="https://github.com/Gallopsled/pwntools-tutorial">Gallopsled/pwntools-tutorial</a>. Not reviewed or endorsed by the original authors; the original text prevails.

theme:
  name: material
  language: ja
  font: false
  logo: assets/minusone-mark.svg
  favicon: assets/minusone-avatar-light.svg
  features:
    - navigation.top
    - navigation.footer
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate


plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Gallopsled/pwntools-tutorial
      name: 原著(Gallopsled/pwntools-tutorial)

nav:
  - はじめに: README.md
  - Pwntools のインストール: installing.md
  - Tubes: tubes.md
  - ユーティリティ: utility.md
  - バイト列と文字列: bytes.md
  - コンテキスト (Context): context.md
  - ELF: elf.md
  - アセンブリ: assembly.md
  - デバッグ: debugging.md
  - ROP: rop.md
  - ログ出力: logging.md
  - 演習:
      - バッファオーバーフロー(基本): walkthrough/buffer-overflow-basic/README.md
      - ELF シンボルと GOT 上書き: walkthrough/elf-symbols-got-overwrite/README.md
      - 他アーキテクチャ: walkthrough/foreign-architecture/README.md
      - シェルコード(基本): walkthrough/shellcode-basic/README.md
      - シェルコード(中級): walkthrough/shellcode-intermediate/README.md
      - シェルコード(上級): walkthrough/shellcode-advanced/README.md
  - 原著(GitHub): https://github.com/Gallopsled/pwntools-tutorial
  - ワークショップのノートブック(GitHub): https://github.com/0xFF-MinusOne/pwntools-tutorial-ja/blob/main/37C3.ipynb

extra_css:
  - assets/ja-docs.css
  - assets/mkdocs.css
  - assets/minusone.css

extra_javascript:
  - assets/ja-docs.js
  - assets/glossary-pwntools.js
  - assets/glossary.js
